<script type="text/x-dc" data-dc-script data-props="{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#DCCBA4&quot;,&quot;options&quot;:[&quot;#DCCBA4&quot;,&quot;#E6D9BC&quot;,&quot;#9FB4CF&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    var base = 'https://www.lordwaverley.com/';
    var list = [
      ['Iran at the Crossroads', 'Paper', base + 'uploads/media/iran-at-the-crossroads-8e8e4d54.pdf'],
      ['Africa: Age of Optimism', 'Article', base + 'media.php?lang=en&slug=africa-the-age-of-optimism'],
      ['Arctic: Complexity in the Making', 'Article', base + 'media.php?lang=en&slug=arctic-complexity-in-the-making'],
      ['Queen Elizabeth II: Tribute', 'Speech', base + 'media.php?lang=en&slug=queen-elizabeth-a-tribute'],
      ['Saving the Steel Industry', 'Article', base + 'media.php?lang=en&slug=saving-the-steel-industry'],
      ['Parliament Revealed', 'Website', 'https://www.parliamentrevealed.org/'],
      ['Challenges & Risks to Achievement of United Nations SDGs', 'Article', base + 'media.php?lang=en&slug=sustainable-development-goals-challenges-risks-to-the-achievement-of-the-sdgs'],

      ['Showcase Kazakhstan', 'Paper', base + 'uploads/media/showcase-kazakhstan-06b473c0.pdf'],
      ['Central African Republic: President visit to London', 'Video', base + 'uploads/media/central-african-republic-president-visit-to-london-d1518f88.mp4'],
      ['Russia: Diplomacy and Defence of the International Order', 'Paper', base + 'uploads/media/russia-diplomacy-and-defence-of-the-international-order-88535ead.pdf'],
      ["Canada's trade war with the US won't end with tariffs", 'Op-ed · The Hill', 'https://thehill.com/opinion/international/6076794-us-canada-trade-war-nickel/'],
      ["Central Asia's Mineral Exits: A Deal to Mine Is Not a Route to Market", 'Paper', base + 'uploads/media/central-asia-s-mineral-exits-97034883.pdf']
    ];
    var articles = list.map(function (x, i) {
      var k = x[1];
      var c = k === 'Paper' ? { bg: '#0E1A2B', fg: '#FFFFFF', line: '#0E1A2B', tag: '#DCCBA4', muted: '#AEB8C7' }
        : (k === 'Video' || k === 'Speech') ? { bg: '#2F4B57', fg: '#FFFFFF', line: '#2F4B57', tag: '#F0D9A8', muted: '#C3D3D9' }
        : k.indexOf('Op-ed') === 0 || k === 'Website' ? { bg: '#DCCBA4', fg: '#0E1A2B', line: '#DCCBA4', tag: '#2A2416', muted: '#3D3320' }
        : { bg: '#FFFFFF', fg: '#0E1A2B', line: '#E4DFD4', tag: '#7A5C2E', muted: '#5E6878' };
      return { num: (i < 9 ? '0' : '') + (i + 1), title: x[0], kind: k, href: x[2], bg: c.bg, fg: c.fg, line: c.line, tag: c.tag, muted: c.muted };
    });
    return { accent: this.props.accent ?? '#DCCBA4', articles: articles };
  }
}
